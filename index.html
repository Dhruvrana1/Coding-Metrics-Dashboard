<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetcode Metrics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1> Leetcode Metrics</h1>
        <div class="user">
            <p> Enter your username below: </p>
            <div class="user_input_field">
                <input type="text" placeholder="Enter your user name here" id="user-input">
                <button id="search_btn"> Search</button>

            </div>
        </div>

        <div class="stats">
            <div class="progress">
                <div class="progress-item">
                    <div class="easy-progress circle">
                        <span id="Easy"></span>
                        <p>Easy</p>
                    </div>
                </div>
                <div class="progress-item circle">
                    <div class="medium-progress circle">
                        <span id="medium"></span>
                        <p>Medium</p>
                    </div>
                </div>
                <div class="progress-item circle">
                    <div class="hard-progress circle">
                        <span id="hard"></span>
                        <p>Hard</p>
                    </div>
                </div>
            </div>

            <div class="stats-container">
            <div class="stats-cards">   
                <!-- directly populate the card from the javascript -->
            </div>
            </div>

        </div>
    
    
    </div>
    <script src="script.js"></script>
</body>
</html>
